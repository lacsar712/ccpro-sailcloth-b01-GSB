services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sailcloth
      POSTGRES_USER: sailcloth
      POSTGRES_PASSWORD: sailcloth
    ports:
      - "6360:5432"
    volumes:
      - sailcloth_3960_8960_6360_pg:/var/lib/postgresql/data
    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U sailcloth -d sailcloth"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 30
    #   start_period: 40s

  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: sailcloth-dev-secret-key-change-me
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: sailcloth
      POSTGRES_USER: sailcloth
      POSTGRES_PASSWORD: sailcloth
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost:3960,http://127.0.0.1:3960"
    ports:
      - "8960:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "3960:80"
    depends_on:
      - backend

volumes:
  sailcloth_3960_8960_6360_pg:
